# nginx — portafolio JG en juanko.com
# Build estático de Vite en /var/www/portafolio, publicado con deploy/publish.sh.
# Instalación, permisos y rollback: deploy/oracle.md.
#
# La instancia corre nginx 1.18.0 (Ubuntu 22.04). Dos consecuencias:
#
#   1. NO usar `http2 on;` — esa directiva es de nginx 1.25.1+ y aquí `nginx -t`
#      la rechaza.
#   2. Tampoco añadir la opción `http2` a estos `listen`. En 1.18 es una opción
#      del socket, no del server: ya la declara mindcheck.juanko.com y repetirla
#      en el mismo :443 da "duplicate listen options", que tumba TODA la
#      configuración del servidor. Comprobado que juanko.com ya sirve HTTP/2
#      heredándola: `curl -sI --http2 https://juanko.com` → HTTP/2 200.

# ---------------------------------------------------------------------------
# HTTP → HTTPS (apex y www, en un solo salto hasta el destino final)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name juanko.com www.juanko.com;

    return 301 https://juanko.com$request_uri;
}

# ---------------------------------------------------------------------------
# www → apex. El certificado de juanko.com cubre los dos nombres.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.juanko.com;

    ssl_certificate /etc/letsencrypt/live/juanko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juanko.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://juanko.com$request_uri;
}

# ---------------------------------------------------------------------------
# El sitio
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name juanko.com;

    ssl_certificate /etc/letsencrypt/live/juanko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juanko.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/portafolio;
    index index.html;

    access_log /var/log/nginx/portafolio.access.log;
    error_log /var/log/nginx/portafolio.error.log;

    # Compresión. El nginx.conf global trae `gzip on` pero con `gzip_types`
    # comentado, así que sin esto solo se comprimiría text/html.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cabeceras de seguridad.
    # OJO: en nginx, un `location` que declara su propio `add_header` DESCARTA
    # todos los heredados. Por eso se repiten en los dos bloques de caché de
    # abajo; si se añade otra cabecera aquí, hay que replicarla también allí.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: desactivado a propósito. Es un compromiso difícil de revertir (el
    # navegador lo cachea meses), así que se activa cuando el sitio lleve un
    # tiempo estable en HTTPS. Sin `includeSubDomains`, para no arrastrar a
    # mindcheck.juanko.com.
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # Assets con hash en el nombre (Vite) → caché agresiva.
    # `^~` para que este prefijo gane al regex de imágenes de abajo: todo lo que
    # Vite mete en /assets/ va con hash, imágenes incluidas, y merece el año.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes y fuentes sin hash (public/) → caché moderada.
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # URLs limpias: /info → /info.html, /work → /work.html
    # (las páginas enlazan a /info.html y /work.html; esto permite ambas formas)
    location = /info {
        try_files /info.html =404;
    }
    location = /work {
        try_files /work.html =404;
    }

    # Página de error propia. `error_page` la sirve con el estado 404 real;
    # ponerla como último argumento de `try_files` la devolvería con un 200,
    # que es lo que hacía la versión anterior de este fichero.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fallback: el fichero, el directorio con su index (así se sirve /v1/) o 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
