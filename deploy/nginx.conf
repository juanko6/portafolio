# nginx — portafolio JG (build estático de Vite en /var/www/portafolio)
# Servido por una instancia Oracle Cloud (ver deploy/oracle.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/portafolio;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Logs
    access_log /var/log/nginx/portafolio.access.log;
    error_log /var/log/nginx/portafolio.error.log;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash en el nombre (Vite) → caché agresiva
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes y favicon → caché moderada
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # URLs limpias: /info → /info.html, /work → /work.html
    # (las páginas enlazan a /info.html y /work.html; esto permite ambas formas)
    location = /info {
        try_files /info.html =404;
    }
    location = /work {
        try_files /work.html =404;
    }

    # Cualquier otra ruta desconocida → página 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fallback principal: servir el archivo si existe, sino 404.html
    location / {
        try_files $uri $uri/ /404.html;
    }
}
